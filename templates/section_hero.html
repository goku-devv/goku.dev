{{ define "section_hero" }}
{{ with .Hero }}
<section class="section section-hero">
    <div class="hair hair-t" aria-hidden="true"></div>
    <div class="hair hair-b" aria-hidden="true"></div>
    <div class="glitch" aria-hidden="true">
        <i style="width:60%;height:18%"></i>
        <i style="width:100%;height:16%"></i>
        <i style="width:44%;height:14%"></i>
        <i style="width:78%;height:20%"></i>
        <i style="width:34%;height:12%"></i>
    </div>
    <div class="cover-top">
        <span class="tag">{{ .Location }}</span>
    </div>
    <div class="cover-body">
        <div class="cover-text">
            <p class="kick">{{ .Role }}</p>
            <h1 class="hero-name">{{ .Name }}</h1>
            {{ if .Tagline }}<p class="hero-tagline">{{ .Tagline }}</p>{{ end }}
        </div>
        <div class="hero-img-wrapper{{ if .ImageDark }} hero-img-wrapper--themed{{ end }}">
            <img class="hero-img hero-img-light" src="{{ .Image }}" alt="{{ .Name }}">
            {{ if .ImageDark }}<img class="hero-img hero-img-dark" src="{{ .ImageDark }}" alt="">{{ end }}
        </div>
    </div>
    {{ if .CTAs }}
    <nav class="hero-ctas" aria-label="Contact">
        {{ range .CTAs }}<a href="{{ .URL }}">{{ .Label }}</a>{{ end }}
    </nav>
    {{ end }}
</section>
{{ end }}
{{ end }}
